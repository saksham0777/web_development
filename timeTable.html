<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Table</title>
</head>
<style>
    table{
        border:2px solid black;
    }
    th,td{
        border:2px solid black;
    }
    h1{
        display:flex;
        justify-content:center;
    }
</style>
<body>
    <h1>Time Table</h1>
    <table>
        <tr>
            <th>Sno</th>
            <th>Subjects</th>
            <th>Time</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Physics</td>
            <td>9:00-10:00</td>
        </tr>
        <tr>
            <td>2</td>
            <td>English</td>
            <td>10:00-11:00</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Chemistry</td>
            <td>11:00-12:00</td>
        </tr>
        <tr>
            <td>4</td>
            <td>Maths</td>
            <td>12:00-13:00</td>
        </tr>
        <tr>
            <td>5</td>
            <td>Lunch Break</td>
            <td>13:00-13:30</td>
        </tr>
    </table>
</body>
</html>
